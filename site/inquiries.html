<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>문의 관리 | 하루한칸</title>
  <link rel="stylesheet" href="./typography.css">
  <style>
    :root{color-scheme:light;--ink:#171b20;--muted:#68717b;--line:#e3e7eb;--accent:#ff9b50;--paper:#f5f6f7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}
    .top{height:64px;background:#fff;border-bottom:1px solid var(--line)}.top-inner{max-width:1040px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none;color:var(--ink)}.top a:last-child{color:var(--muted);font-size:14px}
    main{max-width:1040px;margin:0 auto;padding:52px 22px 80px}.eyebrow{color:#a85a1c;font-size:13px;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.04em;margin:10px 0 8px}.intro{margin:0;color:var(--muted);line-height:1.7}
    .panel{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,32px);box-shadow:0 12px 34px #17202a0a}.hidden{display:none!important}
    .login{max-width:520px}.login p{line-height:1.7;color:var(--muted)}button,select{font:inherit}.button{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px 12px}.notice{min-height:24px;color:#555f69;font-size:14px}.notice.error{color:#b42318}.notice.success{color:#137547}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff}.count{color:var(--muted);font-size:14px}
    .list{display:grid;gap:14px;margin-top:20px}.item{border:1px solid var(--line);border-radius:12px;padding:18px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h2{font-size:17px;margin:0 0 6px}.meta{color:var(--muted);font-size:13px;line-height:1.7}.badge{border-radius:20px;background:#fff2e7;color:#8e4b17;padding:5px 10px;font-size:12px;white-space:nowrap}.badge.contacted{background:#e9f1ff;color:#214da0}.badge.closed{background:#edf0f2;color:#535b63}.contact{margin:12px 0 0;font-weight:700;overflow-wrap:anywhere}.message{margin:10px 0 0;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.item-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:14px}.empty{padding:36px 16px;text-align:center;color:var(--muted)}
    @media(max-width:560px){main{padding-top:36px}.item{padding:15px}.item-head{display:block}.badge{display:inline-block;margin-top:8px}.item-actions{justify-content:flex-start}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="top"><div class="top-inner"><a class="brand" href="./index.html">하루한칸 · 문의 관리</a><a href="./index.html">홈페이지로</a></div></nav>
  <main>
    <div class="eyebrow">PRIVATE ADMIN</div>
    <h1>문의 확인</h1>
    <p class="intro">접수된 문의를 확인하고 답변 상태를 관리합니다. 로그인한 사업자 계정만 내용을 볼 수 있습니다.</p>

    <section class="panel login" id="login-panel" aria-labelledby="login-title">
      <h2 id="login-title">관리자 로그인</h2>
      <p>사업용 네이버 메일로 일회용 로그인 링크를 보냅니다. 메일을 열어 이 페이지로 돌아오면 문의 목록을 확인할 수 있습니다.</p>
      <button class="button" id="send-link" type="button">사업용 메일로 로그인 링크 받기</button>
      <p class="notice" id="login-notice" role="status" aria-live="polite"></p>
    </section>

    <section class="panel hidden" id="inquiries-panel" aria-label="문의 목록">
      <div class="toolbar">
        <span class="count" id="inquiry-count">문의 목록을 불러오는 중…</span>
        <div class="toolbar">
          <label for="status-filter">상태</label>
          <select id="status-filter"><option value="all">전체</option><option value="new">미확인</option><option value="contacted">연락 완료</option><option value="closed">종료</option></select>
          <button class="button secondary" id="refresh" type="button">새로고침</button>
          <button class="button secondary" id="sign-out" type="button">로그아웃</button>
        </div>
      </div>
      <p class="notice" id="list-notice" role="status" aria-live="polite"></p>
      <div class="list" id="inquiry-list"></div>
    </section>
  </main>
  <script>
    (function(){
      'use strict';
      var PROJECT_URL='https://hvnoylwqzpbxxhmnqbzb.supabase.co';
      var PUBLISHABLE_KEY='sb_publishable_lVQLuypc6daj23RZp3x_ug_KfjJPOr0';
      var ADMIN_EMAIL='zxc1316@naver.com';
      var FUNCTION_URL=PROJECT_URL+'/functions/v1/manage-haru-hankan-inquiries';
      var labels={landing_page:'랜딩페이지 제작',logo_branding:'로고·브랜딩',cardpilot:'카드파일럿',other:'기타 문의'};
      var statusLabels={new:'미확인',contacted:'연락 완료',closed:'종료'};
      var loginPanel=document.getElementById('login-panel');
      var listPanel=document.getElementById('inquiries-panel');
      var loginNotice=document.getElementById('login-notice');
      var listNotice=document.getElementById('list-notice');
      var list=document.getElementById('inquiry-list');
      var count=document.getElementById('inquiry-count');
      if(!window.supabase){loginNotice.textContent='로그인 모듈을 불러오지 못했습니다. 페이지를 새로고침해 주세요.';return;}
      var client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

      function setNotice(node,message,kind){node.textContent=message||'';node.className='notice'+(kind?' '+kind:'');}
      function showLogin(message,kind){loginPanel.classList.remove('hidden');listPanel.classList.add('hidden');if(message)setNotice(loginNotice,message,kind);}
      function showList(){loginPanel.classList.add('hidden');listPanel.classList.remove('hidden');}
      async function requestApi(method,body){
        var sessionResult=await client.auth.getSession();
        var session=sessionResult.data&&sessionResult.data.session;
        if(!session)throw new Error('로그인 세션이 만료되었습니다. 다시 로그인해 주세요.');
        var response=await fetch(FUNCTION_URL,{method:method,headers:{'Authorization':'Bearer '+session.access_token,'apikey':PUBLISHABLE_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
        var result={};try{result=await response.json();}catch(_error){}
        if(!response.ok)throw new Error(response.status===401||response.status===403?'접근 권한을 확인할 수 없습니다. 관리자 이메일로 로그인해 주세요.':(result.error||'요청을 처리하지 못했습니다.'));
        return result;
      }
      function element(tag,className,text){var node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
      function renderItems(items){
        list.replaceChildren();
        var filter=document.getElementById('status-filter').value;
        var visible=items.filter(function(item){return filter==='all'||item.status===filter;});
        count.textContent='최근 문의 '+items.length+'건'+(items.length===100?' · 최신 100건만 표시':'');
        if(!visible.length){list.appendChild(element('div','empty',items.length?'선택한 상태의 문의가 없습니다.':'아직 접수된 문의가 없습니다.'));return;}
        visible.forEach(function(item){
          var card=element('article','item');
          var head=element('div','item-head');
          var left=element('div');left.appendChild(element('h2','',item.name||'이름 없음'));
          left.appendChild(element('div','meta',(labels[item.inquiry_type]||'기타 문의')+' · '+new Date(item.created_at).toLocaleString('ko-KR')));
          var badge=element('span','badge'+(item.status==='contacted'?' contacted':item.status==='closed'?' closed':''),statusLabels[item.status]||item.status);
          head.append(left,badge);card.appendChild(head);
          card.appendChild(element('p','contact',item.contact||''));
          if(item.message)card.appendChild(element('p','message',item.message));
          var actions=element('div','item-actions');
          var select=element('select');select.setAttribute('aria-label',item.name+' 문의 상태');
          Object.keys(statusLabels).forEach(function(value){var option=element('option','',statusLabels[value]);option.value=value;option.selected=value===item.status;select.appendChild(option);});
          var save=element('button','button secondary','상태 저장');save.type='button';
          save.addEventListener('click',async function(){save.disabled=true;setNotice(listNotice,'상태를 저장하고 있습니다…');try{await requestApi('PATCH',{id:item.id,status:select.value});item.status=select.value;badge.textContent=statusLabels[item.status];badge.className='badge'+(item.status==='contacted'?' contacted':item.status==='closed'?' closed':'');setNotice(listNotice,'상태를 저장했습니다.','success');}catch(error){setNotice(listNotice,error.message,'error');}finally{save.disabled=false;}});
          actions.append(select,save);card.appendChild(actions);list.appendChild(card);
        });
      }
      async function loadInquiries(){setNotice(listNotice,'문의 목록을 불러오는 중…');try{var result=await requestApi('GET');renderItems(result.inquiries||[]);setNotice(listNotice,'');}catch(error){if(error.message.indexOf('로그인 세션')===0){await client.auth.signOut();showLogin(error.message,'error');}else setNotice(listNotice,error.message,'error');}}
      document.getElementById('send-link').addEventListener('click',async function(event){var button=event.currentTarget;button.disabled=true;setNotice(loginNotice,'로그인 링크를 보내고 있습니다…');try{var result=await client.auth.signInWithOtp({email:ADMIN_EMAIL,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/'}});if(result.error)throw result.error;setNotice(loginNotice,'사업용 메일함에서 로그인 링크를 확인해 주세요.','success');}catch(error){setNotice(loginNotice,'로그인 링크를 보내지 못했습니다. Supabase 인증 설정과 메일 발송 상태를 확인해 주세요.','error');}finally{button.disabled=false;}});
      document.getElementById('refresh').addEventListener('click',loadInquiries);
      document.getElementById('status-filter').addEventListener('change',loadInquiries);
      document.getElementById('sign-out').addEventListener('click',async function(){await client.auth.signOut();showLogin('로그아웃했습니다.','success');});
      client.auth.getSession().then(function(result){var session=result.data&&result.data.session;if(session){client.auth.getUser().then(function(userResult){if(!userResult.data.user||String(userResult.data.user.email||'').toLowerCase()!==ADMIN_EMAIL){client.auth.signOut();showLogin('허용된 사업자 계정이 아닙니다.','error');return;}showList();loadInquiries();});}});
      if(location.hash.indexOf('error')>=0)showLogin('로그인 링크가 만료되었거나 사용할 수 없습니다. 새 링크를 요청해 주세요.','error');
    })();
  </script>
</body>
</html>
